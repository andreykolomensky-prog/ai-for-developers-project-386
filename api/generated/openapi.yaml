openapi: 3.1.0
info:
  title: Запись на звонок
  version: 1.0.0
  description: |-
    Контракт сервиса записи на звонок. Владелец заводит типы встреч и смотрит
    записи, гость выбирает свободный слот в окне записи и создаёт запись.
tags:
  - name: Служебное
  - name: Типы встреч
paths:
  /api/event-types:
    get:
      operationId: listEventTypes
      description: Список типов встреч в порядке создания.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventType'
      tags:
        - Типы встреч
    post:
      operationId: createEventType
      description: Владелец создаёт тип встречи.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '409':
          description: Тип встречи с таким идентификатором уже существует.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypeExistsError'
        '422':
          description: Данные запроса не прошли проверку.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      tags:
        - Типы встреч
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventType'
  /api/event-types/{eventTypeId}:
    get:
      operationId: getEventType
      description: Один тип встречи.
      parameters:
        - name: eventTypeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '404':
          description: Запрошенный ресурс не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      tags:
        - Типы встреч
  /api/event-types/{eventTypeId}/booking-window:
    get:
      operationId: getBookingWindow
      description: 'Окно записи для типа встречи: слоты на ближайшие 14 дней с отметкой занятости.'
      parameters:
        - name: eventTypeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingWindow'
        '404':
          description: Запрошенный ресурс не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      tags:
        - Типы встреч
  /api/health:
    get:
      operationId: getHealth
      description: Проверка, что приложение запущено.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      tags:
        - Служебное
components:
  schemas:
    BookingWindow:
      type: object
      required:
        - timeZone
        - days
      properties:
        timeZone:
          type: string
          description: Часовой пояс владельца (IANA), в котором заданы даты и рабочие часы.
        days:
          type: array
          items:
            $ref: '#/components/schemas/BookingWindowDay'
          description: Ровно 14 дней подряд, первый из них сегодняшний.
      description: 'Окно записи: ближайшие 14 календарных дней, начиная с сегодняшнего.'
    BookingWindowDay:
      type: object
      required:
        - date
        - slots
      properties:
        date:
          type: string
          format: date
          description: Дата в часовом поясе владельца.
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
          description: Слоты дня по возрастанию времени начала.
      description: Слоты одного календарного дня.
    EventType:
      type: object
      required:
        - id
        - title
        - description
        - durationMinutes
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 40
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          description: Идентификатор, который задаёт владелец. Попадает в адрес страницы записи.
        title:
          type: string
          minLength: 1
          maxLength: 80
          description: Название, которое видит гость.
        description:
          type: string
          maxLength: 500
          description: Описание для гостя. Может быть пустым.
        durationMinutes:
          type: integer
          format: int32
          minimum: 5
          maximum: 480
          description: Длительность встречи в минутах. Слот этого типа длится столько же.
      description: 'Тип встречи: шаблон, который заводит владелец.'
    EventTypeExistsError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - event_type_exists
        message:
          type: string
      description: Тип встречи с таким идентификатором уже существует.
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    NotFoundError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - not_found
        message:
          type: string
      description: Запрошенный ресурс не найден.
    Slot:
      type: object
      required:
        - startTime
        - endTime
        - available
      properties:
        startTime:
          type: string
          format: date-time
          description: Начало слота.
        endTime:
          type: string
          format: date-time
          description: 'Конец слота: начало плюс длительность типа встречи.'
        available:
          type: boolean
          description: Свободен ли слот. Слот, который уже начался, недоступен.
      description: 'Слот: интервал, на который гость может записаться.'
    ValidationError:
      type: object
      required:
        - code
        - message
        - issues
      properties:
        code:
          type: string
          enum:
            - validation_error
        message:
          type: string
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
      description: Данные запроса не прошли проверку.
    ValidationIssue:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: Поле запроса, к которому относится замечание.
        message:
          type: string
      description: Одно замечание к данным запроса.
